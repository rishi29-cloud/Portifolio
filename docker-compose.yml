services:
  api:
    build: .
    command: uvicorn reels_analyst.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]
    depends_on: [api]

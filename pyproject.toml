[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reels-analyst"
version = "0.1.0"
description = "Portfolio-ready Instagram Reels analytics pipeline"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pydantic>=2.9.0",
  "streamlit>=1.39.0",
  "typer>=0.12.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.3.0", "ruff>=0.6.0"]

[project.scripts]
reels-analyst = "reels_analyst.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
